<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Gallery</title>
</head>
<style>
    a {
        text-decoration: none;
        color: white;
    }

    a:hover {
        color: red;
    }

    h1, h2 {
        font-size: 40px;
        margin-bottom: 40px;
    }

    p {
        letter-spacing: 1.2px;
    }

    li {
        font-size: 24px;
    }

    .highlight {
        font-weight: bold;
        color: #ff3b3b;
        text-shadow: 0 0 8px rgba(255, 59, 59, 0.3), 0 0 16px rgba(255, 59, 59, 0.5);
    }
</style>

<body>
    <header class="header">
        <nav class="header__nav">
            <a href="/index.html">Home</a>
            <a href="/pages/contact.html">Contacts</a>
        </nav>
    </header>

    <main class="main" style="text-align: center; padding-top: 100px;">
        <section class="gallery">
            <h1 class="gallery__title">My Gallery</h1>
            <div class="gallery__photo">
                <div class="gallery__item">
                    <h2>Photo 1</h2>
                    <img src="/photo/profile.jpg" alt="My photo 1" width="500" height="700">
                </div>

                <div class="gallery__item">
                    <h2>Photo 2</h2>
                    <img src="/photo/photo-1.jpg" alt="My photo 2" width="500" height="700">
                </div>

                <div class="gallery__item">
                    <h2>Photo 3</h2>
                    <img src="/photo/photo-2.jpg" alt="My photo 3" width="500" height="700">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
